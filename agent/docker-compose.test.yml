services:
  pocketful-api:
    build:
      context: ./stage-1
      dockerfile: Dockerfile
    environment:
      PORT: '8080'
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  pocketful-ui:
    build:
      context: ./stage-2
      dockerfile: Dockerfile
    environment:
      PORT: '3000'
      POCKETFUL_API_URL: http://pocketful-api:8080
    ports:
      - '3000:3000'
    depends_on:
      pocketful-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
