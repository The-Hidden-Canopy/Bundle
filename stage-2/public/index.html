<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocketful</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem; color: #111; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    h2 { font-size: 1.1rem; margin: 1.25rem 0 0.5rem; }
    h3 { font-size: 0.95rem; margin: 0.75rem 0 0.25rem; color: #444; }
    label { display: block; font-weight: 500; margin-bottom: 0.2rem; }
    input, select { display: block; width: 100%; padding: 0.4rem 0.6rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 0.6rem; }
    input:focus, select:focus, button:focus { outline: 2px solid #0055cc; outline-offset: 2px; }
    button { padding: 0.4rem 0.9rem; font-size: 1rem; border: 1px solid #aaa; border-radius: 4px; background: #f5f5f5; cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #0055cc; color: #fff; border-color: #004ab3; }
    .error-box { background: #fff0f0; border: 1px solid #c00; border-radius: 4px; padding: 0.45rem 0.7rem; margin: 0.5rem 0; color: #900; font-size: 0.95rem; }
    .success-box { background: #f0fff4; border: 1px solid #090; border-radius: 4px; padding: 0.45rem 0.7rem; margin: 0.5rem 0; color: #060; }
    .warn-box { background: #fffbe6; border: 1px solid #b8860b; border-radius: 4px; padding: 0.45rem 0.7rem; margin: 0.5rem 0; color: #5a4400; }
    nav { display: flex; gap: 0.75rem; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid #ddd; flex-wrap: wrap; align-items: center; }
    nav a { text-decoration: none; color: #0055cc; font-size: 0.95rem; }
    nav a:hover { text-decoration: underline; }
    .balance-card { background: #f0f4ff; border: 1px solid #c0cce8; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .balance-headline { font-size: 2rem; font-weight: 700; }
    .balance-sub { font-size: 0.875rem; color: #555; margin-top: 0.2rem; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.5rem; }
    .muted { color: #666; font-size: 0.875rem; }
    section { margin-bottom: 1.5rem; }
    @media (max-width: 380px) { .balance-headline { font-size: 1.5rem; } }
  </style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';

const API = window.POCKETFUL_API_URL || 'http://localhost:8080';

// ── State ──────────────────────────────────────────────────────────────────────
const st = {
  token:    localStorage.getItem('auth_token'),
  user:     null,
  activity: [],
  requests: [],
  authorizations: [],
  authError: '',
  payState: 'idle',  // idle | pending | success | error | uncertain
  payErrorMsg: '',
  payIntentKey:     localStorage.getItem('pay_intent_current') || null,
  payLastId:        localStorage.getItem('pay_intent_last_id') || null,
  payPendingHandle: localStorage.getItem('pay_intent_handle') || '',
  payPendingAmount: Number(localStorage.getItem('pay_intent_amount') || '0'),
  payPendingNote:   localStorage.getItem('pay_intent_note') || '',
  payPendingVis:    localStorage.getItem('pay_intent_vis') || 'private',
  requestError: '',
  splitShares: null,
  splitError:  '',
  authzError:  '',
};

// ── Utilities ──────────────────────────────────────────────────────────────────
function minorUnits() { return st.user ? (st.user.minor_units || 2) : 2; }

function formatMoney(val) {
  const d = minorUnits();
  const v = BigInt(val);
  const factor = BigInt(10 ** d);
  const sign = v < 0n ? '-' : '';
  const abs  = v < 0n ? -v : v;
  const whole = abs / factor;
  const frac  = (abs % factor).toString().padStart(d, '0');
  return d > 0 ? `${sign}${whole}.${frac}` : `${sign}${whole}`;
}

function parseMoney(str) {
  const d = minorUnits();
  const [int, frac = ''] = str.trim().replace(/[^0-9.]/g, '').split('.');
  const factor = BigInt(10 ** d);
  return BigInt(int || '0') * factor + BigInt(frac.padEnd(d, '0').slice(0, d));
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = (Math.random() * 16) | 0;
    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
  });
}

// ── API helpers ────────────────────────────────────────────────────────────────
async function apiFetch(method, path, body, extra = {}) {
  const headers = { 'Content-Type': 'application/json', ...extra };
  if (st.token) headers['Authorization'] = `Bearer ${st.token}`;
  const opts = { method, headers };
  if (body !== undefined) opts.body = JSON.stringify(body);
  return fetch(`${API}${path}`, opts);
}

async function loadUser() {
  const r = await apiFetch('GET', '/me');
  if (r.status === 401) { signOut(); return; }
  if (r.ok) st.user = await r.json();
}

async function loadActivity() {
  const r = await apiFetch('GET', '/activity?limit=50&offset=0');
  if (r.status === 401) { signOut(); return; }
  if (r.ok) { const d = await r.json(); st.activity = d.payments || []; }
}

async function loadRequests() {
  const r = await apiFetch('GET', '/requests');
  if (r.status === 401) { signOut(); return; }
  if (r.ok) { const d = await r.json(); st.requests = d.requests || []; }
}

async function loadAuthorizations() {
  const r = await apiFetch('GET', '/authorizations?direction=outgoing&status=open&limit=50&offset=0');
  if (r.status === 401) { signOut(); return; }
  if (r.ok) { const d = await r.json(); st.authorizations = d.authorizations || []; }
}

function signOut() {
  st.token = null; st.user = null;
  localStorage.removeItem('auth_token');
  navigate('/login');
}

// ── Router ─────────────────────────────────────────────────────────────────────
function navigate(path) { history.pushState({}, '', path); render(); }
window.addEventListener('popstate', render);
window.nav = (e, p) => { e.preventDefault(); navigate(p); };

// ── Render ─────────────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('root');
  const path = window.location.pathname;
  root.innerHTML = st.token ? renderApp(path) : renderLogin();
  attach();
}

// ── Login / signup ─────────────────────────────────────────────────────────────
function renderLogin() {
  const err = st.authError ? `<div id="auth-error" class="error-box">${esc(st.authError)}</div>` : '';
  return `
  <section>
    <h1>Pocketful</h1>
    ${err}
    <div>
      <h2>Sign in</h2>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="email">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password">
        <button type="submit" id="login-submit" class="btn-primary">Sign in</button>
      </form>
    </div>
    <div style="margin-top:1.5rem">
      <h2>Create account</h2>
      <form id="signup-form">
        <label for="signup-email">Email</label>
        <input id="signup-email" type="email" autocomplete="email">
        <label for="signup-password">Password</label>
        <input id="signup-password" type="password" autocomplete="new-password">
        <label for="signup-display-name">Display name</label>
        <input id="signup-display-name" type="text" autocomplete="name">
        <label for="signup-handle">Handle</label>
        <input id="signup-handle" type="text" autocomplete="off">
        <button type="submit" id="signup-submit" class="btn-primary">Create account</button>
      </form>
    </div>
  </section>`;
}

// ── App shell ──────────────────────────────────────────────────────────────────
function renderApp(path) {
  const nav = `
  <nav>
    <span id="current-user">${esc(st.user?.display_name || '')}</span>
    (<span id="current-handle">${esc(st.user?.handle || '')}</span>)
    <a href="/" onclick="nav(event,'/')">Home</a>
    <a href="/requests" onclick="nav(event,'/requests')">Requests</a>
    <a href="/split" onclick="nav(event,'/split')">Split</a>
    <a href="/authorizations" onclick="nav(event,'/authorizations')">Authorizations</a>
    <button id="logout-button">Sign out</button>
  </nav>`;
  const body =
    (path === '/requests')      ? renderRequests() :
    (path === '/split')         ? renderSplit() :
    (path === '/authorizations')? renderAuthorizations() :
                                  renderHome();
  return nav + body;
}

// ── Balance block ──────────────────────────────────────────────────────────────
function renderBalance() {
  if (!st.user) return '';
  const total     = st.user.total     ?? st.user.balance ?? 0;
  const available = st.user.available ?? total;
  const held      = BigInt(st.user.held ?? 0);
  const heldHtml  = held !== 0n
    ? `<div class="balance-sub">
        <span id="wallet-held" data-amount="${st.user.held}">${formatMoney(st.user.held)} held</span>
       </div>`
    : '';
  return `
  <div class="balance-card">
    <div class="balance-headline">
      <span id="wallet-available" data-amount="${available}">${formatMoney(available)}</span>
      <span style="font-size:0.8rem;font-weight:400;color:#555"> available</span>
    </div>
    <div class="balance-sub">Total: <span id="wallet-balance" data-amount="${total}">${formatMoney(total)}</span></div>
    ${heldHtml}
    <button id="wallet-refresh" style="margin-top:0.5rem">Refresh</button>
  </div>`;
}

// ── Pay form ───────────────────────────────────────────────────────────────────
function renderPayState() {
  switch (st.payState) {
    case 'pending':  return `<div id="pay-pending" class="warn-box">Sending payment…</div>`;
    case 'success':  return `<div id="pay-success" class="success-box">Payment sent successfully.</div>`;
    case 'error':    return `<div id="pay-error" class="error-box">${esc(st.payErrorMsg)}</div>`;
    case 'uncertain': return `<div id="pay-uncertain" class="warn-box">
      Payment status unknown — we sent your request but received no response.
      <br><small>Click Refresh to check. Your payment key is retained for retry.</small>
    </div>`;
    default: return '';
  }
}

function renderPayForm() {
  const busy = st.payState === 'pending' || st.payState === 'uncertain';
  const dis  = busy ? 'disabled' : '';
  return `
  <section>
    <h2>Send payment</h2>
    ${renderPayState()}
    <form id="pay-form">
      <label for="pay-handle">To handle</label>
      <input id="pay-handle" type="text" autocomplete="off" ${dis}>
      <label for="pay-amount">Amount</label>
      <input id="pay-amount" type="text" inputmode="decimal" ${dis}>
      <label for="pay-note">Note</label>
      <input id="pay-note" type="text" ${dis}>
      <label for="pay-visibility">Visibility</label>
      <select id="pay-visibility" ${dis}>
        <option value="public">Public</option>
        <option value="private">Private</option>
      </select>
      <button type="submit" class="btn-primary" ${dis}>Send</button>
    </form>
  </section>`;
}

// ── Activity feed ──────────────────────────────────────────────────────────────
function renderActivity() {
  if (!st.activity.length) {
    return `<section><h2>Activity</h2><div id="empty-activity">No activity yet.</div></section>`;
  }
  const rows = st.activity.map(p => `
    <div id="activity-item-${esc(p.payment_id)}" class="card" data-visibility="${esc(p.visibility)}">
      <div id="activity-parties-${esc(p.payment_id)}">${esc(p.from_handle)} → ${esc(p.to_handle)}</div>
      <div id="activity-amount-${esc(p.payment_id)}">${formatMoney(p.amount)}</div>
      <div id="activity-note-${esc(p.payment_id)}">${esc(p.note || '')}</div>
    </div>`).join('');
  return `<section><h2>Activity</h2><div id="activity-list">${rows}</div></section>`;
}

// ── Home ───────────────────────────────────────────────────────────────────────
function renderHome() { return renderBalance() + renderPayForm() + renderActivity(); }

// ── Requests ───────────────────────────────────────────────────────────────────
function renderRequests() {
  const handle = st.user?.handle || '';
  const inc = st.requests.filter(r => r.payer_handle === handle);
  const out = st.requests.filter(r => r.payer_handle !== handle);

  const card = (r, isIncoming) => {
    const actions = isIncoming && r.status === 'pending'
      ? `<button id="request-pay-${esc(r.request_id)}" data-id="${esc(r.request_id)}">Pay</button>
         <button id="request-decline-${esc(r.request_id)}" data-id="${esc(r.request_id)}">Decline</button>`
      : !isIncoming && r.status === 'pending'
      ? `<button id="request-cancel-${esc(r.request_id)}" data-id="${esc(r.request_id)}">Cancel</button>`
      : '';
    return `
    <div id="item-${esc(r.request_id)}" class="card" data-status="${esc(r.status)}">
      <div id="request-amount-${esc(r.request_id)}">${formatMoney(r.amount)}</div>
      <div class="muted">${esc(r.note || '')} · ${esc(r.status)}</div>
      <div style="margin-top:0.35rem">${actions}</div>
    </div>`;
  };

  const errHtml   = st.requestError ? `<div id="request-error" class="error-box">${esc(st.requestError)}</div>` : '';
  const emptyHtml = !st.requests.length ? `<div id="empty-requests">No requests.</div>` : '';

  return `
  <section>
    <h2>Requests</h2>
    ${errHtml}${emptyHtml}
    <div id="incoming-list">
      <h3>Incoming</h3>
      ${inc.length ? inc.map(r => card(r, true)).join('') : '<p class="muted">None</p>'}
    </div>
    <div id="outgoing-list">
      <h3>Outgoing</h3>
      ${out.length ? out.map(r => card(r, false)).join('') : '<p class="muted">None</p>'}
    </div>
  </section>`;
}

// ── Split ──────────────────────────────────────────────────────────────────────
function renderSplit() {
  const errHtml = st.splitError ? `<div id="split-error" class="error-box">${esc(st.splitError)}</div>` : '';
  const preview = st.splitShares
    ? `<div id="split-preview" class="card" style="margin-top:0.5rem">
        <strong>Preview</strong>
        ${st.splitShares.map(s =>
          `<div><span id="split-share-${esc(s.handle)}">${esc(s.handle)}: ${formatMoney(s.amount)}</span></div>`
        ).join('')}
       </div>`
    : '';
  return `
  <section>
    <h2>Split bill</h2>
    ${errHtml}
    <form id="split-form">
      <label for="split-amount">Total amount</label>
      <input id="split-amount" type="text" inputmode="decimal">
      <label for="split-handles">Participant handles (comma-separated)</label>
      <input id="split-handles" type="text" autocomplete="off">
      <label for="split-note">Note</label>
      <input id="split-note" type="text">
      <button type="submit" id="split-submit" class="btn-primary">Create split</button>
    </form>
    ${preview}
  </section>`;
}

// ── Authorizations ─────────────────────────────────────────────────────────────
function renderAuthorizations() {
  const errHtml   = st.authzError ? `<div id="authorization-error" class="error-box">${esc(st.authzError)}</div>` : '';
  const emptyHtml = !st.authorizations.length ? `<div id="empty-authorizations">No open authorizations.</div>` : '';

  const items = st.authorizations.map(a => {
    const captureHtml = a.status === 'open' ? `
      <input id="authorization-capture-amount-${esc(a.authorization_id)}" type="text"
        inputmode="decimal" placeholder="Amount" style="width:8rem;display:inline-block;margin-right:0.5rem">
      <button id="authorization-capture-${esc(a.authorization_id)}" data-id="${esc(a.authorization_id)}">Capture</button>
      <button id="authorization-void-${esc(a.authorization_id)}" data-id="${esc(a.authorization_id)}" style="margin-left:0.35rem">Void</button>` : '';
    return `
    <div id="authorization-item-${esc(a.authorization_id)}" class="card" data-status="${esc(a.status)}">
      <div id="authorization-amount-${esc(a.authorization_id)}">${formatMoney(a.amount)}</div>
      <div id="authorization-captured-${esc(a.authorization_id)}" class="muted">Captured: ${formatMoney(a.captured_amount || 0)}</div>
      <div id="authorization-expires-${esc(a.authorization_id)}" class="muted">${esc(a.expires_at || '')}</div>
      <div style="margin-top:0.35rem">${captureHtml}</div>
    </div>`;
  }).join('');

  return `
  <section>
    <h2>Authorizations</h2>
    ${errHtml}
    <form id="authorize-form">
      <label for="authorize-handle">To handle</label>
      <input id="authorize-handle" type="text" autocomplete="off">
      <label for="authorize-amount">Amount</label>
      <input id="authorize-amount" type="text" inputmode="decimal">
      <label for="authorize-note">Note</label>
      <input id="authorize-note" type="text">
      <label for="authorize-visibility">Visibility</label>
      <select id="authorize-visibility">
        <option value="public">Public</option>
        <option value="private">Private</option>
      </select>
      <button type="submit" id="authorize-submit" class="btn-primary">Authorize</button>
    </form>
    ${emptyHtml}
    <div id="authorization-list">${items}</div>
  </section>`;
}

// ── Event handlers ─────────────────────────────────────────────────────────────
function attach() {
  // logout
  on('logout-button', 'click', signOut);

  // wallet-refresh — also handles pay-uncertain reconciliation
  on('wallet-refresh', 'click', async () => {
    if (st.payState === 'uncertain' && st.payIntentKey) {
      try {
        const r = await apiFetch('POST', '/payments',
          { to_handle: st.payPendingHandle, amount: st.payPendingAmount,
            note: st.payPendingNote || undefined, visibility: st.payPendingVis },
          { 'Idempotency-Key': st.payIntentKey }
        );
        if (r.status === 200 || r.status === 201) {
          const d = await r.json();
          st.payLastId = d.payment_id;
          localStorage.setItem('pay_intent_last_id', d.payment_id);
        }
      } catch { /* stay uncertain */ }
    }
    await Promise.all([loadUser(), loadActivity()]);
    if (st.payState === 'uncertain' && st.payLastId) {
      const confirmed = st.activity.find(p => p.payment_id === st.payLastId);
      if (confirmed) {
        st.payState = 'success';
        st.payIntentKey = null;
        localStorage.removeItem('pay_intent_current');
        localStorage.removeItem('pay_intent_last_id');
        localStorage.removeItem('pay_intent_handle');
        localStorage.removeItem('pay_intent_amount');
        localStorage.removeItem('pay_intent_note');
        localStorage.removeItem('pay_intent_vis');
      }
    }
    render();
  });

  // login
  onForm('login-form', async (fd) => {
    const r = await apiFetch('POST', '/auth/login', {
      email: fd.get('login-email'), password: fd.get('login-password'),
    });
    if (r.ok) {
      const d = await r.json();
      st.token = d.token; st.authError = '';
      localStorage.setItem('auth_token', d.token);
      await Promise.all([loadUser(), loadActivity()]);
      navigate('/');
    } else {
      const d = await r.json().catch(() => ({}));
      st.authError = d.error?.message || 'Sign in failed';
      render();
    }
  });

  // signup
  onForm('signup-form', async (fd) => {
    const r = await apiFetch('POST', '/auth/signup', {
      email: fd.get('signup-email'), password: fd.get('signup-password'),
      display_name: fd.get('signup-display-name'), handle: fd.get('signup-handle'),
    });
    if (r.ok) {
      const d = await r.json();
      st.token = d.token; st.authError = '';
      localStorage.setItem('auth_token', d.token);
      await Promise.all([loadUser(), loadActivity()]);
      navigate('/');
    } else {
      const d = await r.json().catch(() => ({}));
      st.authError = d.error?.message || 'Sign up failed';
      render();
    }
  });

  // pay form
  onForm('pay-form', async (fd) => {
    const handle = (fd.get('pay-handle') || '').trim();
    const amtStr = (fd.get('pay-amount') || '').trim();
    const note   = (fd.get('pay-note') || '').trim();
    const vis    = fd.get('pay-visibility') || 'private';

    let amount;
    try { amount = Number(parseMoney(amtStr)); }
    catch { st.payState = 'error'; st.payErrorMsg = 'Invalid amount'; render(); return; }

    if (!st.payIntentKey) {
      st.payIntentKey = uuid();
      localStorage.setItem('pay_intent_current', st.payIntentKey);
    }
    st.payPendingHandle = handle; st.payPendingAmount = amount;
    st.payPendingNote = note;     st.payPendingVis = vis;
    localStorage.setItem('pay_intent_handle', handle);
    localStorage.setItem('pay_intent_amount', String(amount));
    localStorage.setItem('pay_intent_note', note);
    localStorage.setItem('pay_intent_vis', vis);

    st.payState = 'pending';
    render(); // #pay-pending visible before fetch

    try {
      const r = await apiFetch('POST', '/payments',
        { to_handle: handle, amount, note: note || undefined, visibility: vis },
        { 'Idempotency-Key': st.payIntentKey }
      );
      if (r.status === 201 || r.status === 200) {
        const d = await r.json();
        st.payLastId = d.payment_id;
        st.payIntentKey = null;
        ['pay_intent_current','pay_intent_last_id','pay_intent_handle',
         'pay_intent_amount','pay_intent_note','pay_intent_vis'].forEach(k => localStorage.removeItem(k));
        st.payState = 'success';
        await Promise.all([loadUser(), loadActivity()]);
      } else if (r.status === 401) {
        signOut(); return;
      } else {
        const d = await r.json().catch(() => ({}));
        const code = d.error?.code || '';
        st.payErrorMsg =
          code === 'insufficient_funds'    ? 'Insufficient funds' :
          code === 'idempotency_key_reuse' ? 'Already sent with a different body' :
          d.error?.message || `Error ${r.status}`;
        st.payState = 'error';
      }
    } catch {
      st.payState = 'uncertain'; // lost response — retain key
    }
    render();
  });

  // request actions
  delegate('[id^="request-pay-"]', 'click', async (btn) => {
    const id = btn.dataset.id; if (!id) return;
    const r = await apiFetch('POST', `/requests/${id}/pay`, {},
      { 'Idempotency-Key': `req-pay-${id}` });
    if (r.status === 201 || r.status === 200) {
      st.requestError = '';
      await Promise.all([loadRequests(), loadUser(), loadActivity()]);
    } else {
      const d = await r.json().catch(() => ({}));
      st.requestError = d.error?.message || `Failed (${r.status})`;
    }
    render();
  });

  delegate('[id^="request-decline-"]', 'click', async (btn) => {
    const id = btn.dataset.id; if (!id) return;
    const r = await apiFetch('POST', `/requests/${id}/decline`, {},
      { 'Idempotency-Key': `req-decline-${id}` });
    if (r.ok) { st.requestError = ''; await loadRequests(); }
    else { const d = await r.json().catch(()=>({})); st.requestError = d.error?.message||'Failed'; }
    render();
  });

  delegate('[id^="request-cancel-"]', 'click', async (btn) => {
    const id = btn.dataset.id; if (!id) return;
    const r = await apiFetch('POST', `/requests/${id}/cancel`, {},
      { 'Idempotency-Key': `req-cancel-${id}` });
    if (r.ok) { st.requestError = ''; await loadRequests(); }
    else { const d = await r.json().catch(()=>({})); st.requestError = d.error?.message||'Failed'; }
    render();
  });

  // split preview — live update on input
  const splitAmt = document.getElementById('split-amount');
  const splitH   = document.getElementById('split-handles');
  function updatePreview() {
    const aStr = (splitAmt?.value || '').trim();
    const hStr = (splitH?.value || '').trim();
    if (!aStr || !hStr) { st.splitShares = null; render(); return; }
    try {
      const amount  = Number(parseMoney(aStr));
      const handles = hStr.split(',').map(h => h.trim()).filter(Boolean);
      if (!handles.length || !amount) { st.splitShares = null; render(); return; }
      const n   = handles.length;
      const base = Math.floor(amount / n);
      const rem  = amount % n;
      st.splitShares = handles.map((h, i) => ({ handle: h, amount: base + (i < rem ? 1 : 0) }));
    } catch { st.splitShares = null; }
    render();
  }
  splitAmt?.addEventListener('input', updatePreview);
  splitH?.addEventListener('input', updatePreview);

  // split submit
  onForm('split-form', async (fd) => {
    const aStr  = (fd.get('split-amount') || '').trim();
    const hStr  = (fd.get('split-handles') || '').trim();
    const note  = (fd.get('split-note') || '').trim();
    let amount;
    try { amount = Number(parseMoney(aStr)); }
    catch { st.splitError = 'Invalid amount'; render(); return; }
    const participant_handles = hStr.split(',').map(h => h.trim()).filter(Boolean);
    const r = await apiFetch('POST', '/splits',
      { amount, participant_handles, note: note || undefined },
      { 'Idempotency-Key': uuid() });
    if (r.status === 201) {
      const d = await r.json();
      st.splitShares = d.shares; st.splitError = '';
    } else {
      const d = await r.json().catch(() => ({}));
      st.splitError = d.error?.message || `Error ${r.status}`; st.splitShares = null;
    }
    render();
  });

  // authorize form
  onForm('authorize-form', async (fd) => {
    const to_handle = (fd.get('authorize-handle') || '').trim();
    const aStr      = (fd.get('authorize-amount') || '').trim();
    const note      = (fd.get('authorize-note') || '').trim();
    const visibility= fd.get('authorize-visibility') || 'private';
    let amount;
    try { amount = Number(parseMoney(aStr)); }
    catch { st.authzError = 'Invalid amount'; render(); return; }
    const r = await apiFetch('POST', '/authorizations',
      { to_handle, amount, note: note || undefined, visibility },
      { 'Idempotency-Key': uuid() });
    if (r.status === 201) {
      st.authzError = ''; await loadAuthorizations();
    } else {
      const d = await r.json().catch(() => ({}));
      st.authzError = d.error?.message || `Error ${r.status}`;
    }
    render();
  });

  // capture — only buttons that are NOT the capture-amount input
  document.querySelectorAll('[id^="authorization-capture-"]:not([type="text"])').forEach(btn => {
    const id = btn.dataset.id; if (!id) return;
    btn.addEventListener('click', async () => {
      const amtEl = document.getElementById(`authorization-capture-amount-${id}`);
      const body  = {};
      if (amtEl?.value.trim()) body.amount = Number(parseMoney(amtEl.value.trim()));
      const r = await apiFetch('POST', `/authorizations/${id}/capture`, body,
        { 'Idempotency-Key': uuid() });
      if (r.status === 201) {
        st.authzError = ''; await Promise.all([loadAuthorizations(), loadUser(), loadActivity()]);
      } else {
        const d = await r.json().catch(() => ({})); st.authzError = d.error?.message || `Capture failed ${r.status}`;
      }
      render();
    });
  });

  // void
  document.querySelectorAll('[id^="authorization-void-"]').forEach(btn => {
    const id = btn.dataset.id; if (!id) return;
    btn.addEventListener('click', async () => {
      const r = await apiFetch('POST', `/authorizations/${id}/void`, {});
      if (r.status === 200 || r.status === 201) {
        st.authzError = ''; await loadAuthorizations();
      } else {
        const d = await r.json().catch(() => ({})); st.authzError = d.error?.message || `Void failed ${r.status}`;
      }
      render();
    });
  });
}

// ── Helper: attach single element handler ──────────────────────────────────────
function on(id, evt, fn) {
  document.getElementById(id)?.addEventListener(evt, fn);
}

// ── Helper: form submit with FormData ──────────────────────────────────────────
function onForm(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('submit', (e) => { e.preventDefault(); fn(new FormData(el)); });
}

// ── Helper: delegated event on matching selector ───────────────────────────────
function delegate(sel, evt, fn) {
  document.querySelectorAll(sel).forEach(el => el.addEventListener(evt, () => fn(el)));
}

// ── Boot ───────────────────────────────────────────────────────────────────────
async function boot() {
  if (st.token) {
    const path = window.location.pathname;
    const loads = [loadUser(), loadActivity()];
    if (path === '/requests')       loads.push(loadRequests());
    if (path === '/authorizations') loads.push(loadAuthorizations());
    await Promise.all(loads);
    if (st.payIntentKey) st.payState = 'uncertain';
  }
  render();
}

boot();
</script>
</body>
